<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dash Nodes: network map</title>
  <meta name="description" content="Live map of the Dash network: every masternode and reachable node by city, from a crawl every 15 minutes.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/map.js"></script>
</head>
<body class="app">
<main class="map-app">
  <aside class="mp" id="panel" aria-label="Map controls">
    <button class="mp-handle" type="button" id="panel-handle" aria-expanded="false" aria-controls="panel-body">
      <span class="mp-grip" aria-hidden="true"></span><span class="sr-only">Show map controls</span>
    </button>
    <div class="mp-head" id="panel-head"></div>
    <div class="mp-body" id="panel-body"></div>
  </aside>
  <div id="map" class="map" role="region" aria-label="Map of the Dash network"></div>
</main>
</body>
</html>
