<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DashHQ Radar: network map</title>
  <meta name="description" content="Live map of the Dash network: every masternode and reachable node by city, from a crawl every 15 minutes.">
  <link rel="canonical" href="https://radar.dashhq.org/map">
  <meta property="og:site_name" content="DashHQ Radar">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DashHQ Radar: network map">
  <meta property="og:description" content="Live map of the Dash network: every masternode and reachable node by city, from a crawl every 15 minutes.">
  <meta property="og:url" content="https://radar.dashhq.org/map">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <!-- TODO(icon): worker/scripts/build.mjs puts the PNG icon set and og:image here once
       web/assets/icons/ has it (see the README there). Until then favicon.svg is the icon. -->
  <link rel="manifest" href="/assets/site.webmanifest">
  <link rel="stylesheet" href="/assets/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/map.js"></script>
</head>
<body class="app">
<main class="map-app">
  <aside class="mp" id="panel" data-mode="peek" aria-label="Map controls">
    <button class="mp-handle" type="button" id="panel-handle" aria-expanded="false" aria-controls="panel-body">
      <span class="mp-grip" aria-hidden="true"></span><span class="sr-only">Show map controls</span>
    </button>
    <div class="mp-head" id="panel-head"></div>
    <div class="mp-body" id="panel-body"></div>
  </aside>
  <div id="map" class="map" role="region" aria-label="Map of the Dash network"></div>
</main>
</body>
</html>
