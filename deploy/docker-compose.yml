# dash-nodes: dashd (mainnet + testnet), the crawler/monitor app, and the publisher that pushes the
# app's API documents to the Cloudflare Worker serving nodes.dashhq.org.
#
#   scripts/init.sh                  once: generates secrets/rpc_password and .env
#   docker compose up -d --build     everything
#
# Nothing here takes inbound traffic from the internet: the publisher only connects out to the Worker.
# dashd RPC is reachable on the compose network only; the app's HTTP port is for the LAN.

name: dash-nodes

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-dashd: &dashd
  # Volumes mount at /home/dash, the image's declared VOLUME; the datadir is /home/dash/.dashcore.
  image: dashpay/dashd:${DASHD_TAG:-24.0.0-rc.4}
  restart: unless-stopped
  logging: *default-logging
  # Give dashd time to flush; an unclean stop can mean a long replay on mainnet.
  stop_grace_period: 3m
  entrypoint: ["/bin/sh", "/opt/dash-nodes/dashd-entrypoint.sh"]
  secrets:
    - rpc_password
  networks:
    - core
  healthcheck:
    # Passes once RPC is out of warm-up, not when synced.
    test: ["CMD", "dash-cli", "-conf=/tmp/dash.conf", "getblockcount"]
    interval: 30s
    timeout: 20s
    retries: 5
    start_period: 20m

services:
  dashd-mainnet:
    <<: *dashd
    environment:
      DASH_NETWORK: mainnet
      DASHD_DBCACHE_MB: ${MAINNET_DBCACHE_MB:-1536}
      DASHD_EXTRA_ARGS: ${MAINNET_DASHD_ARGS:-}
    volumes:
      - dashd-mainnet:/home/dash
      - ./dashd/dash.conf:/etc/dash-nodes/dash.conf:ro
      - ./dashd/entrypoint.sh:/opt/dash-nodes/dashd-entrypoint.sh:ro

  dashd-testnet:
    <<: *dashd
    environment:
      DASH_NETWORK: testnet
      DASHD_DBCACHE_MB: ${TESTNET_DBCACHE_MB:-512}
      DASHD_EXTRA_ARGS: ${TESTNET_DASHD_ARGS:-}
    volumes:
      - dashd-testnet:/home/dash
      - ./dashd/dash.conf:/etc/dash-nodes/dash.conf:ro
      - ./dashd/entrypoint.sh:/opt/dash-nodes/dashd-entrypoint.sh:ro

  app:
    build:
      context: ..
    image: dash-nodes:${APP_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - dashd-mainnet
      - dashd-testnet
    environment:
      MAINNET_RPC: http://dashd-mainnet:9998
      TESTNET_RPC: http://dashd-testnet:19998
      RPC_USER: dashnodes
      RPC_PASSWORD_FILE: /run/secrets/rpc_password
      DATA_DIR: /data
      CRAWL_INTERVAL: ${CRAWL_INTERVAL:-900}
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-128}
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - rpc_password
    volumes:
      - app-data:/data
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    networks:
      - core
      - edge

  publisher:
    image: node:${NODE_TAG:-24-alpine}
    restart: unless-stopped
    logging: *default-logging
    user: "1000:1000"
    depends_on:
      - app
    working_dir: /publisher
    command: ["node", "scripts/publish.mjs"]
    environment:
      SOURCE: http://app:8080
      TARGET: ${PUBLISH_TARGET:-https://nodes.dashhq.org}
      INGEST_TOKEN_FILE: /run/secrets/ingest_token
    secrets:
      - ingest_token
    volumes:
      - ../worker/src:/publisher/src:ro
      - ../worker/scripts:/publisher/scripts:ro
    networks:
      - edge

networks:
  core:
    ipam:
      config:
        - subnet: 172.30.86.0/24
  edge: {}

volumes:
  dashd-mainnet:
  dashd-testnet:
  app-data:

secrets:
  rpc_password:
    file: ./secrets/rpc_password
  ingest_token:
    file: ./secrets/ingest_token
