# dash-nodes: dashd (mainnet + testnet), the crawler/monitor app with Tor and I2P clients so both can
# reach onion and I2P peers (+ optional cjdns), and the publisher that pushes the app's API documents
# to the Cloudflare Worker serving nodes.dashhq.org.
#
#   scripts/init.sh                  once: generates secrets and .env
#   docker compose up -d --build     everything
#   COMPOSE_PROFILES=cjdns, CJDNS=true   also run a cjdns node (needs /dev/net/tun, see README)
#
# Nothing here takes inbound traffic from the internet: the publisher only connects out to the Worker.
# dashd RPC, Tor's SOCKS port and i2pd's SOCKS/SAM ports are reachable on the compose networks only;
# the app's HTTP port is for the LAN. Tor and i2pd sit on their own `overlay` network, not on `core`,
# so they can't reach dashd's RPC. Needs Docker Engine 28+ and Compose 2.33+ (the IPv6-only `cjdns`
# network).

name: dash-nodes

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# Tor and i2pd handle untrusted traffic and need no privileges at all.
x-hardened: &hardened
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp

x-dashd: &dashd
  # Volumes mount at /home/dash, the image's declared VOLUME; the datadir is /home/dash/.dashcore.
  image: dashpay/dashd:${DASHD_TAG:-24.0.0-rc.4}
  restart: unless-stopped
  logging: *default-logging
  # Give dashd time to flush; an unclean stop can mean a long replay on mainnet.
  stop_grace_period: 3m
  entrypoint: ["/bin/sh", "/opt/dash-nodes/dashd-entrypoint.sh"]
  secrets:
    - rpc_password
  # overlay: Tor and i2pd. cjdns: IPv6 to the cjdns node (used when CJDNS=true with the cjdns
  # profile; on a host with IPv6 it's also Docker's NAT66 to the internet).
  networks:
    - core
    - overlay
    - cjdns
  healthcheck:
    # Passes once RPC is out of warm-up, not when synced.
    test: ["CMD", "dash-cli", "-conf=/tmp/dash.conf", "getblockcount"]
    interval: 30s
    timeout: 20s
    retries: 5
    start_period: 20m

services:
  dashd-mainnet:
    <<: *dashd
    environment:
      DASH_NETWORK: mainnet
      DASHD_DBCACHE_MB: ${MAINNET_DBCACHE_MB:-1536}
      DASHD_EXTRA_ARGS: ${MAINNET_DASHD_ARGS:-}
      DASHD_ONION: 172.30.88.10:9050
      DASHD_I2PSAM: 172.30.88.11:7656
      DASHD_CJDNSREACHABLE: ${CJDNS:-false}
    volumes:
      - dashd-mainnet:/home/dash
      - ./dashd/dash.conf:/etc/dash-nodes/dash.conf:ro
      - ./dashd/entrypoint.sh:/opt/dash-nodes/dashd-entrypoint.sh:ro

  dashd-testnet:
    <<: *dashd
    environment:
      DASH_NETWORK: testnet
      DASHD_DBCACHE_MB: ${TESTNET_DBCACHE_MB:-512}
      DASHD_EXTRA_ARGS: ${TESTNET_DASHD_ARGS:-}
      DASHD_ONION: 172.30.88.10:9050
      DASHD_I2PSAM: 172.30.88.11:7656
      DASHD_CJDNSREACHABLE: ${CJDNS:-false}
    volumes:
      - dashd-testnet:/home/dash
      - ./dashd/dash.conf:/etc/dash-nodes/dash.conf:ro
      - ./dashd/entrypoint.sh:/opt/dash-nodes/dashd-entrypoint.sh:ro

  app:
    build:
      context: ..
    image: dash-nodes:${APP_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - dashd-mainnet
      - dashd-testnet
      - tor
      - i2pd
    environment:
      MAINNET_RPC: http://dashd-mainnet:9998
      TESTNET_RPC: http://dashd-testnet:19998
      RPC_USER: dashnodes
      RPC_PASSWORD_FILE: /run/secrets/rpc_password
      DATA_DIR: /data
      CRAWL_INTERVAL: ${CRAWL_INTERVAL:-900}
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-128}
      TOR_CONCURRENCY: ${TOR_CONCURRENCY:-16}
      I2P_CONCURRENCY: ${I2P_CONCURRENCY:-8}
      TOR_PROXY: 172.30.88.10:9050
      I2P_PROXY: 172.30.88.11:4447
      CRAWL_IPV6: ${CRAWL_IPV6:-auto}
      IPV6_PROXY: ${IPV6_PROXY:-}
      # Through the cjdns container's NAT, which the app can't detect by itself: say so.
      CJDNS: ${CJDNS:-auto}
      RUST_LOG: ${RUST_LOG:-info}
    secrets:
      - rpc_password
    volumes:
      - app-data:/data
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    networks:
      - core
      - edge
      - overlay
      - cjdns

  # Tor client: SOCKS for .onion peers (the app's TOR_PROXY, dashd's -onion). No relay, no exit.
  tor:
    build: ./tor
    image: dash-nodes-tor:${APP_TAG:-local}
    restart: unless-stopped
    logging: *default-logging
    <<: *hardened
    volumes:
      - tor-data:/var/lib/tor
    networks:
      overlay:
        ipv4_address: 172.30.88.10

  # i2pd: SOCKS for the app (I2P_PROXY), SAM for dashd (-i2psam). Firewalled, low bandwidth, no
  # web console (see i2pd/i2pd.conf).
  i2pd:
    image: purplei2p/i2pd:${I2PD_TAG:-release-3.0.0.1}
    restart: unless-stopped
    logging: *default-logging
    <<: *hardened
    command: ["--conf=/etc/i2pd/i2pd.conf"]
    volumes:
      - i2pd-data:/home/i2pd/data
      - ./i2pd/i2pd.conf:/etc/i2pd/i2pd.conf:ro
    networks:
      overlay:
        ipv4_address: 172.30.88.11

  # cjdns node with a TUN device (needs /dev/net/tun and NET_ADMIN). It peers outbound over UDP from
  # its own network namespace (via `edge`), so nothing is exposed outside the host, and NATs
  # fc00::/8 traffic from the `cjdns` network out of cjdns0.
  cjdns:
    build: ./cjdns
    image: dash-nodes-cjdns:${APP_TAG:-local}
    profiles: ["cjdns"]
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv6.conf.all.forwarding: "1"
    security_opt:
      - no-new-privileges:true
    environment:
      CJDNS_NAT: "1"
    volumes:
      - cjdns-data:/etc/cjdns
      - ./cjdns/peers.json:/etc/cjdns-peers/peers.json:ro
    networks:
      edge: {}
      cjdns:
        ipv6_address: fd86:d4a5:1c3e:186::fe

  # Docker can't give containers a static route, so this sets one on the host instead: fc00::/8
  # via the cjdns container. Containers on the `cjdns` network send IPv6 to the host (their
  # gateway), which forwards CJDNS traffic to cjdns. Re-applied every 30 s, so it survives network
  # re-creation; removed when the helper stops. Anything else IPv6 still has no route and fails
  # within about a second.
  cjdns-route:
    image: dash-nodes-cjdns:${APP_TAG:-local}
    profiles: ["cjdns"]
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - cjdns
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    read_only: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        via=fd86:d4a5:1c3e:186::fe
        trap 'ip -6 route del fc00::/8 via $$via 2>/dev/null; exit 0' TERM INT
        while :; do ip -6 route replace fc00::/8 via $$via 2>/dev/null; sleep 30 & wait $$!; done

  publisher:
    image: node:${NODE_TAG:-24-alpine}
    restart: unless-stopped
    logging: *default-logging
    user: "1000:1000"
    depends_on:
      - app
    working_dir: /publisher
    command: ["node", "scripts/publish.mjs"]
    environment:
      SOURCE: http://app:8080
      TARGET: ${PUBLISH_TARGET:-https://nodes.dashhq.org}
      INGEST_TOKEN_FILE: /run/secrets/ingest_token
    secrets:
      - ingest_token
    volumes:
      - ../worker/src:/publisher/src:ro
      - ../worker/scripts:/publisher/scripts:ro
    networks:
      - edge

networks:
  core:
    ipam:
      config:
        - subnet: 172.30.86.0/24
  edge: {}
  # Tor and i2pd. Static addresses sit above the dynamic range.
  overlay:
    ipam:
      config:
        - subnet: 172.30.88.0/24
          ip_range: 172.30.88.128/25
  # IPv6 only (ULA), so it never becomes anyone's IPv4 default route. Its gateway is the host,
  # which routes fc00::/8 to the cjdns container (cjdns-route).
  cjdns:
    enable_ipv4: false
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd86:d4a5:1c3e:186::/64

volumes:
  dashd-mainnet:
  dashd-testnet:
  app-data:
  tor-data:
  i2pd-data:
  cjdns-data:

secrets:
  rpc_password:
    file: ./secrets/rpc_password
  ingest_token:
    file: ./secrets/ingest_token
