# dash-nodes i2pd: SOCKS (for the crawler) and SAM (for dashd) on the compose network only;
# no web console, no HTTP proxy, no outproxy. It runs firewalled (nothing is published from
# the host) with a low bandwidth class and a cap on transit tunnels.
log = stdout
# warn logs every unknown peer profile; errors are enough.
loglevel = error
ipv4 = true
ipv6 = false
# L = 32 KB/s for transit traffic; share 50% of it.
bandwidth = L
share = 50
floodfill = false

[ntcp2]
enabled = true
published = false

[ssu2]
enabled = true

[limits]
transittunnels = 200

[http]
enabled = false

[httpproxy]
enabled = false

[socksproxy]
enabled = true
address = 0.0.0.0
port = 4447
outproxy.enabled = false

[sam]
enabled = true
address = 0.0.0.0
port = 7656

[upnp]
enabled = false

[reseed]
verify = true
