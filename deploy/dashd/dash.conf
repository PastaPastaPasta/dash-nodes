# dash-nodes dashd template. The entrypoint copies it to /tmp/dash.conf and appends the network
# section, RPC credentials and dbcache. Nothing secret lives here.
server=1
# `masternode payments` recomputes block fees, which needs every spent output: txindex is required.
txindex=1
disablewallet=1
# Observer only: no inbound P2P. The crawler makes its own outbound connections.
listen=0
rpcthreads=8
rpcworkqueue=64
rpcservertimeout=300
printtoconsole=1
logtimestamps=1
