# dash-nodes dashd template. The entrypoint copies it to /tmp/dash.conf and appends the network
# section, RPC credentials and dbcache. Nothing secret lives here.
server=1
# Pruned: only the latest blocks are kept (about 2 GB). The app needs the chain state, the
# masternode list (evodb, kept in full) and recent blocks for payments; no txindex. Pruning needs
# governance off, which the site doesn't use.
prune=2048
disablegovernance=1
disablewallet=1
# Observer only: no inbound P2P. The crawler makes its own outbound connections.
listen=0
rpcthreads=8
rpcworkqueue=64
rpcservertimeout=300
printtoconsole=1
logtimestamps=1
